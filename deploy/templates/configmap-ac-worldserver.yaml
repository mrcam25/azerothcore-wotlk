apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.images.ac_worldserver.name }}-cm"
  labels:
    buildDate: {{ now | date "2006-01-02T15.04.05" }}
    app: {{ .Values.app.name }}
data:
  env.ac: |
    #
    # GENERAL
    #

    USER_CONF_PATH=/azerothcore/apps/docker/config-docker.sh
    DATAPATH=/azerothcore/env/dist/data

    #
    # COMPILER
    #

    CTYPE=RelWithDebInfo
    CSCRIPTS=static
    AC_CCACHE=true

    #
    # SIMPLE RESTARTER
    #
    AC_RESTARTER_BINPATH=
    AC_RESTARTER_BINFILE=
    AC_RESTARTER_WITHGDB=

    # Dynamic environment variables from values.yaml
    AC_DATA_DIR={{ .Values.ac_worldserver.environment.AC_DATA_DIR | quote }}
    AC_LOGS_DIR={{ .Values.ac_worldserver.environment.AC_LOGS_DIR | quote }}
    AC_LOGIN_DATABASE_INFO={{ .Values.ac_worldserver.environment.AC_LOGIN_DATABASE_INFO | quote }}
    AC_WORLD_DATABASE_INFO={{ .Values.ac_worldserver.environment.AC_WORLD_DATABASE_INFO | quote }}
    AC_CHARACTER_DATABASE_INFO={{ .Values.ac_worldserver.environment.AC_CHARACTER_DATABASE_INFO | quote }}

    DOCKER_AC_ENV_FILE="conf/dist/env.ac"
    ACORE_COMPONENT="worldserver"
